name: 🔐 CI Base

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      args:
        required: true
        type: string

jobs:
  run-uv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: {% raw %}${{ inputs.name }}-${{ github.ref_name }}{% endraw %}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        with:
          version: "0.7.4"
          enable-cache: true
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run {% raw %}${{ inputs.name }}{% endraw %}
        run: uv run {% raw %}${{ inputs.args }}{% endraw %}